DATA:
  # Racine où sont stockés les altos téléchargés (un sous-dossier par label)
  prepared_data_path: "/mnt/data/classifier_eer/prod/data"
  # Racine où est écrit le metadata.pkl global
  data_path: "/mnt/data/classifier_eer/prod/data"

  minio_client: "min-ap27426-prod-d80a6b43-0.data.cloud.xxx"

  # Paramètres d'échantillonnage appliqués à chaque label
  sampling:
    n_train: 200
    n_test: 100
    seed: 42

  # Statut par défaut des documents à charger (surchargeable par label)
  default_target_status:
    - "validated"

  # ---------------------------------------------------------------------------
  # Clés optionnelles par label :
  #
  #   split_mode            : stratégie d'attribution train/test.
  #       "strict"     (défaut) -> le filename doit commencer par "train" ou "test",
  #                     sinon le document est exclu.
  #       "test_only"  -> seul le préfixe "test" est discriminant, tout le reste
  #                     bascule en "train".
  #       "random"     -> le filename ne porte aucune indication (cas du workspace
  #                     explo 77, nomenclature TRI_<TYPE>_XXXX.pdf) : le split est
  #                     tiré aléatoirement, sans recouvrement entre train et test.
  #
  #   filename_regex        : ne conserve que les filenames correspondant à cette
  #                     regex. Indispensable sur un workspace multi-labels pour
  #                     isoler les documents d'une typologie donnée.
  #
  #   index_pattern         : regex de capture de l'index numérique en fin de nom.
  #                     Défaut : '_(\d+)\.[^.]+$'
  #
  #   excluded_index_ranges : plages d'index (inclusives) à écarter, définies
  #                     séparément pour "train" et "test" car les numérotations
  #                     des deux lots sont indépendantes.
  #
  #   target_status         : surcharge du statut à charger pour ce label.
  #   enabled               : false -> le label est ignoré.
  # ---------------------------------------------------------------------------
  labels:
    # -------------------------------------------------------------------------
    # Workspaces dédiés (un label = un workspace)
    # -------------------------------------------------------------------------
    - label: "doc_avis_impot"
      workspaceId: 187

    - label: "doc_fiche_paie"
      workspaceId: 189

    - label: "doc_cni_old_format"
      workspaceId: 75
      split_mode: "test_only"
      index_pattern: '_(\d+)\.[^.]+$'
      excluded_index_ranges:
        train:
          - [500, 750]
        test:
          - [100, 180]

    - label: "doc_cni_new_format"
      workspaceId: 74
      split_mode: "test_only"
      index_pattern: '_(\d+)\.[^.]+$'
      excluded_index_ranges:
        train:
          - [500, 750]
        test:
          - [100, 180]

    - label: "doc_passeport"
      workspaceId: 119

    - label: "doc_drs_template"
      workspaceId: 80

    # -------------------------------------------------------------------------
    # Workspace explo 77 (multi-labels, provisoire)
    #
    # Ces typologies n'ont pas encore de workspace dédié : elles sont chargées
    # depuis le workspace explo en attendant. Nomenclature TRI_<TYPE>_XXXX.pdf,
    # sans préfixe train/test -> split aléatoire.
    # Le label cible retenu dans le metadata reste celui déclaré ici.
    # -------------------------------------------------------------------------
    - label: "doc_titre_sejour"
      workspaceId: 77
      target_status:
        - "nonSupervised"
      split_mode: "random"
      filename_regex: '^TRI_TITRE_SEJOUR_\d+\.pdf$'

    - label: "doc_passeport_etranger"
      workspaceId: 77
      target_status:
        - "nonSupervised"
      split_mode: "random"
      filename_regex: '^TRI_PASSEPORT_ETRANGER_\d+\.pdf$'

    - label: "doc_cni_etrangere"
      workspaceId: 77
      target_status:
        - "nonSupervised"
      split_mode: "random"
      filename_regex: '^TRI_CNI_ETR_\d+\.pdf$'

    # Facture : périmètre encore mal cadré (FACTURE_ENERGIE / MOBILE / INTERNET),
    # désactivée en attendant clarification de la nomenclature cible.
    - label: "doc_facture"
      workspaceId: 77
      enabled: false
      target_status:
        - "nonSupervised"
      split_mode: "random"
      filename_regex: '^TRI_FACTURE_(ENERGIE|MOBILE|INTERNET)_\d+\.pdf$'
