DATA:
  # Racine où sont stockés les altos téléchargés (un sous-dossier par label)
  prepared_data_path: "/mnt/data/classifier_eer/prod/data"
  # Racine où est écrit le metadata.pkl global
  data_path: "/mnt/data/classifier_eer/prod/data"

  minio_client: "min-ap27426-prod-d80a6b43-0.data.cloud.xxx"

  # Paramètres d'échantillonnage appliqués à chaque label
  sampling:
    n_train: 200
    n_test: 100
    seed: 42

  # Statut par défaut des documents à charger (surchargeable par label)
  default_target_status:
    - "validated"

  # ---------------------------------------------------------------------------
  # Clés optionnelles par label :
  #   split_mode            : "strict" (défaut) -> le filename doit commencer par
  #                           "train" ou "test", sinon le doc est exclu.
  #                           "test_only" -> seul le préfixe "test" est discriminant,
  #                           tout le reste bascule en "train".
  #   index_pattern         : regex de capture de l'index numérique en fin de nom.
  #                           Défaut : '_(\d+)\.[^.]+$'
  #   excluded_index_ranges : plages d'index (inclusives) à écarter, définies
  #                           séparément pour "train" et "test" car les
  #                           numérotations sont indépendantes.
  #   target_status         : surcharge du statut à charger pour ce label.
  #   enabled               : false -> le label (et son workspace) est ignoré.
  # ---------------------------------------------------------------------------
  labels:
    - label: "doc_avis_impot"
      workspaceId: 187

    - label: "doc_fiche_paie"
      workspaceId: 189

    - label: "doc_cni_old_format"
      workspaceId: 75
      split_mode: "test_only"
      index_pattern: '_(\d+)\.[^.]+$'
      excluded_index_ranges:
        train:
          - [500, 750]
        test:
          - [100, 180]

    - label: "doc_cni_new_format"
      workspaceId: 74
      split_mode: "test_only"
      index_pattern: '_(\d+)\.[^.]+$'
      excluded_index_ranges:
        train:
          - [500, 750]
        test:
          - [100, 180]

    - label: "doc_passeport"
      workspaceId: 119

    - label: "doc_drs_template"
      workspaceId: 80

    # -------------------------------------------------------------------------
    # Workspace explo 77 : multi-labels, déprioritisé pour le moment.
    # Ces labels sont désactivés (enabled: false) et seront réactivés avec leur
    # propre nomenclature de filename + statut nonSupervised.
    # -------------------------------------------------------------------------
    - label: "doc_titre_sejour"
      workspaceId: 77
      enabled: false
      target_status:
        - "nonSupervised"
      filename_type: "TITRE_SEJOUR"

    - label: "doc_paseport_etranger"
      workspaceId: 77
      enabled: false
      target_status:
        - "nonSupervised"
      filename_type: "PASSEPORT_ETRANGER"

    - label: "doc_cni_etrangere"
      workspaceId: 77
      enabled: false
      target_status:
        - "nonSupervised"
      filename_type: "CNI_ETR"

    - label: "doc_facture"
      workspaceId: 77
      enabled: false
      target_status:
        - "nonSupervised"
      filename_type: "FACTURE_ENERGIE|FACTURE_MOBILE|FACTURE_INTERNET"
