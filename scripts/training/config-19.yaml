# Increase version number whenever you train a new model with new data
LOGGING :
  logger_name : "document_detection"

MLFLOW :
  type : model  # Model or pipeline
  status : prod  # Start with explo, when going to prod retrain
  version : "v1"
  experiment_name : document_detection_eer
  #folder_output : /mnt/data/classifier_eer/prod/models/document_detection
  # [auto] model_name as {parent_parent_folder_extraction}
  # [auto] experiment_name as {model_name}(_explo)
  # [auto] run_name as {mlflow_version}(_explo)_{date_ymdhms}
  # [auto] folder_version as {project_saving_root}/{project_name}/
  # [auto] folder_run as {folder_version}/{run_name}
  # [auto] (opt. model) model_filename as {model_name}_{run_name}
  # [auto] (opt. pipeline) pipeline_folder as /resources for docfactory

ARTIFACTS :
  final_model_name : ""  # "model_name_v1"
  final_model_path : ""

PARAMS :
  random_state : 42
  # prepare data
  # Share of the train pool carved out for validation.
  # There is no test_size any more: the test set is frozen by load_data
  # (filename prefix or hash split) and simply replayed by prepare_data.
  validation_size : 0.15
  # add_multi_documents : False
  # Train model
  # edge_case_known_words : 20

DATA:
  use_experiment_data : True
  status : prod
  version : "v1"
  data_path : "/mnt/data/classifier_eer/prod/datas/document_detection/v1"
  minio_client : "min-ap27426-prod-d80a6b43-0.data.cloud.net.intra"

  # Sampling parameters applied to each label
  sampling:
    n_train: 200
    n_test: 100
    seed: 42
    # Column used as the stable identity of a document across runs. The filename is
    # preferred over the upload id, which changes whenever a document is re-uploaded.
    key_column: "filename"
    # Hash scores are normalized into [0, hash_space). A fraction of that space is
    # compared against a threshold to derive the train/test split in "random" mode.
    hash_space: 10000
    # Test share used when a pool cannot cover n_train + n_test. Only applies to the
    # "random" split mode: labels split by filename prefix keep whatever is available.
    test_ratio: 0.3

  # Default regex capturing the numeric index at the end of a filename, used when a
  # label defines no "index_pattern" of its own.
  # Handles: cni_new_0157.pdf, cni_new_157.pdf, test_cni_new_0157.pdf, TRI_CNI_ETR_0297.pdf
  index_pattern_default: '_(\d+)\.[^.]+$'

  # Default status of the documents to load (can be overridden per label)
  default_target_status:
    - "validated"

  # ---------------------------------------------------------------------------
  # Optional keys per label:
  #
  #   split_mode            : train/test assignment strategy.
  #       "strict"     (default) -> the filename must start with "train" or "test",
  #                     otherwise the document is discarded.
  #       "test_only"  -> only the "test" prefix is discriminant, everything else
  #                     falls back to "train".
  #       "random"     -> the filename carries no train/test hint (exploration
  #                     workspace 77, TRI_<TYPE>_XXXX.pdf convention): the split is
  #                     derived from a per-document hash, with no overlap between
  #                     train and test.
  #
  #   filename_regex        : keep only the filenames matching this regex. Required
  #                     on a multi-label workspace to isolate a given document type.
  #
  #   index_pattern         : regex capturing the numeric index at the end of the
  #                     filename. Default: '_(\d+)\.[^.]+$'
  #
  #   excluded_index_ranges : index ranges (inclusive) to discard, defined separately
  #                     for "train" and "test" since both lots are numbered
  #                     independently.
  #
  #   target_status         : override of the status to load for this label.
  #   enabled               : false -> the label is skipped.
  # ---------------------------------------------------------------------------
  labels:
    # -------------------------------------------------------------------------
    # Dedicated workspaces (one label = one workspace)
    # -------------------------------------------------------------------------
    - label: "doc_avis_impot"
      workspaceId: 187

    - label: "doc_fiche_paie"
      workspaceId: 189

    - label: "doc_cni_old_format"
      workspaceId: 75
      split_mode: "test_only"
      index_pattern: '_(\d+)\.[^.]+$'
      excluded_index_ranges:
        train:
          - [500, 750]
        test:
          - [100, 180]

    - label: "doc_cni_new_format"
      workspaceId: 74
      split_mode: "test_only"
      index_pattern: '_(\d+)\.[^.]+$'
      excluded_index_ranges:
        train:
          - [500, 750]
        test:
          - [100, 180]

    - label: "doc_passeport"
      workspaceId: 119

    # -------------------------------------------------------------------------
    # Exploration workspace 77 (multi-label, temporary)
    #
    # These document types have no dedicated workspace yet: they are loaded from
    # the exploration workspace in the meantime. TRI_<TYPE>_XXXX.pdf convention,
    # with no train/test prefix -> hash split.
    # The target label kept in the metadata remains the one declared here.
    # -------------------------------------------------------------------------
    - label: "doc_titre_sejour"
      workspaceId: 77
      target_status:
        - "nonSupervised"
      split_mode: "random"
      filename_regex: '^TRI_TITRE_SEJOUR_\d+\.pdf$'

    - label: "doc_passeport_etranger"
      workspaceId: 77
      target_status:
        - "nonSupervised"
      split_mode: "random"
      filename_regex: '^TRI_PASSEPORT_ETRANGER_\d+\.pdf$'

    - label: "doc_cni_etrangere"
      workspaceId: 77
      target_status:
        - "nonSupervised"
      split_mode: "random"
      filename_regex: '^TRI_CNI_ETR_\d+\.pdf$'

    - label: "doc_drs_template"
      workspaceId: 77
      target_status:
        - "nonSupervised"
      split_mode: "random"
      filename_regex: '^TRI_DRS_PM_\d+\.pdf$'

    # Invoices: scope not settled yet (FACTURE_ENERGIE / MOBILE / INTERNET),
    # disabled until the target naming convention is confirmed.
    - label: "doc_facture"
      workspaceId: 77
      enabled: false
      target_status:
        - "nonSupervised"
      split_mode: "random"
      filename_regex: '^TRI_FACTURE_(ENERGIE|MOBILE|INTERNET)_\d+\.pdf$'
